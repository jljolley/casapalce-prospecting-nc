# NC county -> hub mapping  (Section 5 of the build spec)
#
# Format: hub -> [counties].  geo.py inverts this to county -> hub at load time.
# County names must match config/nc_zip_county.csv exactly (no " County" suffix).
#
# Triangle and Triad are the FOCUS markets — they get the +15 focus_hub scoring
# modifier (see scoring.yaml -> modifiers.focus_hub). Charlotte Metro is the
# largest commercial market and has the best open-data coverage, but is not a
# focus market per current GTM. All other counties are grouped into regional
# hubs so nothing meaningful falls silently to "Other".
#
# Editing: move a county between hubs freely; add new hubs as needed. If you
# want to add a hub to the focus set, also add it to scoring.yaml -> focus_hubs.

# ---- FOCUS MARKETS ----
